<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aegis-AI Dashboard</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 40px; }
        .terminal-box { border: 1px solid #00ff00; padding: 25px; background: #000; box-shadow: 0 0 15px #00ff00; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; display: flex; align-items: center; }
        input, select { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 12px; margin-right: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; }
        pre { background: #050505; border-left: 3px solid #00ff00; padding: 15px; white-space: pre-wrap; font-size: 14px; }
        #loader { color: yellow; display: none; margin: 10px 0; }
        .defense-box { border: 1px solid #ff0000; box-shadow: 0 0 15px #ff0000; color: #ff5555; margin-top: 30px; }
        .attack-btn { background: #ff0000; color: #fff; margin-top: 20px; display: none; border: 1px solid white; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="terminal-box">
        <h1>[ AEGIS-AI: UNIFIED OFFENSIVE ENGINE ]</h1>
        <form id="scanForm">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="target" value="host.docker.internal" required>
                <select name="scan_type">
                    <option value="lab">LAB AUDIT (8081-8083)</option>
                    <option value="web">WEB AUDIT (TOP 100 PORTS)</option>
                    <option value="top100">QUICK RECON (COMMON PORTS)</option>
                    <option value="full">DEEP PENETRATION (65K PORTS)</option>
                </select>
                <button type="submit" id="execBtn">INITIATE MISSION</button>
                <label style="margin-left:15px; font-size:12px;">
                    <input type="checkbox" name="stealth_mode"> STEALTH MODE
                </label>
            </div>
        </form>
        
        <div id="loader">[*] ORCHESTRATING MISSION... (NMAP + WEB + OSINT)</div>
        
        <div id="resultsArea" style="display:none;">
            <h3 style="color: yellow;">[ MISSION INTELLIGENCE REPORT ]</h3>
            <pre id="outputBox"></pre>
            <button class="attack-btn" id="attackBtn" onclick="alert('Breach sequence initiated...')">EXECUTE BREACH SEQUENCE</button>
        </div>
    </div>

    <div class="terminal-box defense-box">
        <h2>[ AEGIS-AI: DEFENSIVE MONITOR ]</h2>
        <div id="trafficBox" style="height: 150px; overflow-y: auto; font-size: 12px;">
            >>> INITIALIZING LISTENER...
        </div>
    </div>

    <script>
        document.getElementById('scanForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('execBtn');
            const loader = document.getElementById('loader');
            const output = document.getElementById('outputBox');
            const resultsArea = document.getElementById('resultsArea');
            const attackBtn = document.getElementById('attackBtn');

            btn.disabled = true;
            loader.style.display = 'block';
            resultsArea.style.display = 'none';

            try {
                const response = await fetch('', { method: 'POST', body: new FormData(e.target) });
                const data = await response.json();
                
                loader.style.display = 'none';
                btn.disabled = false;
                resultsArea.style.display = 'block';
                output.textContent = data.results;
                
                if(data.results.includes("EXPLOITABLE") || data.results.includes("CRITICAL")) {
                    attackBtn.style.display = 'block';
                }
            } catch (error) {
                alert("Mission Failed: Connection Lost");
                loader.style.display = 'none';
                btn.disabled = false;
            }
        };

        // Live Traffic Listener
        setInterval(async () => {
            try {
                const response = await fetch('/live-traffic/');
                const data = await response.json();
                const box = document.getElementById('trafficBox');
                if (data.traffic.length > 0) {
                    box.innerHTML = data.traffic.map(p => `[ALERT] Traffic from ${p.source} Detected<br>`).join('');
                    box.scrollTop = box.scrollHeight;
                }
            } catch (e) {}
        }, 3000);
    </script>
</body>
</html>
