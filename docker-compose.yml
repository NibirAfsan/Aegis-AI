services:

  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8081:80"
    networks:
      - aegis-net

  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "8082:3000"
    networks:
      - aegis-net

  metasploitable:
    image: tleemcjr/metasploitable2
    ports:
      - "8083:80"
      - "2222:22"
      - "2121:21"
      - "3306:3306"
      - "5432:5432"
      - "6200:6200"    # vsftpd 2.3.4 backdoor bind port
      - "1524:1524"    # ingreslock root bindshell (instant root, no exploit module needed)
      - "6667:6667"    # UnrealIRCd 3.2.8.1 backdoor
      - "6697:6697"    # UnrealIRCd alternate/SSL port
      - "3632:3632"    # distcc RCE (CVE-2004-2687) — most reliable through Docker NAT
      - "1099:1099"    # Java RMI (CVE-2011-3556)
      - "8787:8787"    # Ruby DRb (CVE-2013-0156)
    restart: unless-stopped
    platform: linux/amd64
    networks:
      - aegis-net
    tty: true
    stdin_open: true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - aegis-net

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config "api.addrs.addr.name=.*"
      -config "api.addrs.addr.regex=true"
      -config "api.key=aegis_zap_key"
    ports:
      - "8090:8080"
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge
